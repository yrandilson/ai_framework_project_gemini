<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: 400px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center text-blue-600">AI Chatbot</h1>
        <div id="chat-box" class="chat-container border p-4 mb-4 rounded bg-gray-50 flex flex-col gap-2">
            <div class="bg-blue-100 p-2 rounded self-start max-w-[80%]">Olá! Como posso ajudar você hoje?</div>
        </div>
        <div class="flex gap-2">
            <input type="text" id="user-input" class="flex-1 border p-2 rounded" placeholder="Digite sua mensagem...">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Enviar</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            
            if (!message) return;

            // Adicionar mensagem do usuário
            chatBox.innerHTML += `<div class="bg-gray-200 p-2 rounded self-end max-w-[80%]">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Chamar o backend do framework
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: message })
                });
                const data = await response.json();
                
                // Adicionar resposta da IA
                chatBox.innerHTML += `<div class="bg-blue-100 p-2 rounded self-start max-w-[80%]">${data.response || data.error}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="bg-red-100 p-2 rounded self-start max-w-[80%]">Erro ao conectar com o servidor.</div>`;
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Permitir enviar com Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
